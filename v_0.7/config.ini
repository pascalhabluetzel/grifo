# =============================================================================
#  GRIFO - configuration of grifo.ipynb
# =============================================================================
#
#  Every setting the notebook uses is in this file. Each one is explained above
#  it:
#    Allowed     the values the notebook accepts
#    Default     the value used if you delete the line
#    Suggestion  how to choose a value
#    Effect      what changes, and what can go wrong, when you change it
#
#  Syntax
#    - One "key = value" per line, inside a [section].
#    - Lines starting with # are comments. On a value line, text after " ;"
#      is a comment too.
#    - yes/no settings also accept true/false, on/off and 1/0.
#    - Paths are relative to the folder of the notebook.
#    - Fractions are written 0.97, not 97 %; settings in % say so.
#
#  After a change, rerun the notebook section that uses the setting (named in
#  each section heading) and all sections after it: later sections read the
#  files written by earlier ones.
#
# =============================================================================


# -----------------------------------------------------------------------------
[paths]
# Used by: all sections
# -----------------------------------------------------------------------------

# Folder with the demultiplexed reads: one subfolder per sample (e.g. barcode01)
# holding that sample's *.fastq.gz files. The subfolder name becomes the sample
# name.
#   Allowed:  a folder path. Required (no default).
#   Effect:   every folder below it that contains *.fastq.gz files becomes a
#             sample, including this folder itself if FASTQ files lie directly in
#             it. Merged copies next to the original chunks are counted twice.
path_data = ./data

# Folder where all results are written (qc/, taxonomy/, haplotype_networks/).
#   Default:    results
#   Suggestion: use a new folder name to keep the results of an earlier run, e.g.
#               when comparing settings.
#   Effect:     sections 3-6 read the output of earlier sections from this folder;
#               after changing it, start again at section 2.
path_results = results

# Reference database for the taxonomy: a FASTA file with taxonomy in the headers
# (MIDORI2, SINTAX/UTAX, QIIME/UNITE, SILVA/PR2 or "ID Genus species").
# Despite the name this is the FASTA file, not a BLAST database (that one is
# [haplonet] blastdb).
#   Allowed:    a FASTA file. Required unless [haplonet] db is set.
#   Suggestion: use the database of the marker your primers amplify; for these
#               16S fish primers the MIDORI2 lrRNA (16S) file.
#   Effect:     a database of another marker, or one missing your region's
#               species, gives few hits, "no hits" OTUs, or assignments to the
#               closest relative that is in the database instead of the real
#               species.
path_to_blastdb = MIDORI2_TOTAL_NUC_GB273_lrRNA_RAW.fasta


# -----------------------------------------------------------------------------
[NanoFilt]
# Used by: section 2 (read QC). All three settings are required.
# -----------------------------------------------------------------------------

# Shortest read kept (bp).
#   Allowed:    whole number >= 1, not larger than maxlength.
#   Suggestion: a little below the shortest amplicon you expect, primers and tags
#               included. For this 16S fish marker the amplicons are ~110-120 bp,
#               so 90-100.
#   Effect:     too high removes real amplicons of species with a shorter
#               fragment; too low keeps primer dimers and broken reads. Those are
#               removed later anyway, but they slow the clustering down.
minlength = 100

# Longest read kept (bp).
#   Allowed:    whole number, not smaller than minlength.
#   Suggestion: a little above the longest amplicon you expect, e.g. 2-3x the
#               amplicon length (250-350 for this marker) to remove long
#               off-target products and concatemers early.
#   Effect:     a high value keeps long off-target products; they end up as
#               "no hits" OTUs. Too low removes real amplicons.
maxlength = 800

# Minimum mean read quality (Phred score). NanoFilt only takes whole numbers.
#   Allowed:    whole number >= 0.
#   Suggestion: 10 (~90 % accuracy) for R9.4.1 reads; 15-20 for R10.4.1 reads
#               basecalled in hac/sup mode. Check the kept % per sample in
#               section 2 and the MultiQC report.
#   Effect:     higher gives more accurate reads and cleaner clusters but fewer
#               reads; samples with few reads may lose rare taxa. Lower keeps more
#               reads, but sequencing errors can create false clusters and ASVs.
qscore = 20


# -----------------------------------------------------------------------------
[clustering]
# Used by: section 4 (clustering of the reads of each sample into consensus
# sequences). Run both cells of section 4 again after a change.
# -----------------------------------------------------------------------------

# Clustering iterations (split, sweep and merge rounds).
#   Allowed:    whole number >= 1. Required.
#   Suggestion: 5-10 (the original method uses 10).
#   Effect:     more iterations find rarer clusters and give more stable results;
#               the run time grows roughly in proportion. Too few can miss
#               low-abundance taxa.
niter = 5

# Samples clustered at the same time.
#   Allowed:    whole number >= 1.
#   Default:    4
#   Suggestion: parallel_samples x threads = the number of CPU cores of your
#               computer.
#   Effect:     more is faster, but each sample needs its own memory; too many
#               makes the computer swap and everything slower.
parallel_samples = 4

# Threads per sample: minimap2 threads and parallel spoa jobs.
#   Allowed:    whole number >= 1.
#   Default:    2
#   Effect:     see parallel_samples. Results don't depend on it.
threads = 2

# Reads per cluster used to build the consensus sequence (spoa).
#   Allowed:    whole number >= 2.
#   Default:    20
#   Suggestion: 20-50. Keep it at least 10 for nanopore reads.
#   Effect:     more reads average out more sequencing errors and give a more
#               accurate consensus, but take longer. With few reads, errors stay
#               in the consensus; with otu_identity = 1.0 (below) every such error
#               becomes a separate ASV/OTU with its own haplotype.
consensus_reads = 20

# Reads sampled per cluster to compute pairwise distances when splitting
# clusters and searching for new ones.
#   Allowed:    whole number >= 10.
#   Default:    2000
#   Suggestion: 1000-3000.
#   Effect:     time and memory grow with the square of this number. Larger
#               values detect variants that make up a smaller share of a cluster;
#               smaller values are faster but can merge rare taxa into abundant
#               ones.
subsample = 2000

# Sweep step: reads are split into this many groups by how well they fit their
# cluster; the worst-fitting group is searched for new clusters.
#   Allowed:    whole number >= 2.
#   Default:    4
#   Suggestion: keep 4; lower it to 3 if you suspect missed taxa.
#   Effect:     lower values search a larger share of the reads (2 = the worst
#               half), finding more new clusters, including clusters of noise;
#               higher values are more conservative.
sweep_partitions = 4

# Merge step: clusters whose reads align alike (cosine distance of their
# alignment-score profiles below this value) are merged.
#   Allowed:    number between 0 and 1.
#   Default:    0.9
#   Suggestion: keep 0.9 unless you see the same taxon as several clusters
#               (raise it) or closely related taxa merged (lower it).
#   Effect:     higher merges more: fewer duplicate clusters, but closely related
#               species or haplotypes can be merged into one. Lower merges less.
merge_threshold = 0.9

# minimap2 options for aligning reads to cluster centres and to each other.
#   Allowed:    minimap2 command-line options. -D must stay (it stops reads
#               aligning to themselves).
#   Default:    -k15 -w10 -p 0.9 -D
#   Suggestion: change only if you know minimap2. For very short amplicons
#               (< 150 bp) a smaller k-mer (-k13) can align more reads.
#   Effect:     -k: k-mer size (smaller = more sensitive, slower); -w: minimizer
#               window; -p: minimum score of secondary alignments relative to the
#               best.
minimap2_options = -k15 -w10 -p 0.9 -D

# spoa options for building the consensus sequences.
#   Allowed:    spoa command-line options. -r 0 must stay (consensus output).
#   Default:    -n -15 -g -10 -l 0 -r 0
#   Suggestion: keep the default.
#   Effect:     -n: mismatch score; -g: gap score; -l: alignment mode (0 local,
#               1 global, 2 semi-global).
spoa_options = -n -15 -g -10 -l 0 -r 0

# Seed of the random number generator.
#   Allowed:    a whole number, or empty.
#   Default:    empty
#   Suggestion: set a number (e.g. 1) when results must be reproducible.
#   Effect:     empty: reads are sampled differently each run, so cluster numbers
#               and rare clusters can differ slightly between runs. With a number,
#               the same input gives the same clusters.
seed =


# -----------------------------------------------------------------------------
[read_assignment]
# Used by: section 4. After clustering, every read is assigned to its best
# cluster; these assigned reads are the read counts of the ASV and OTU tables.
# -----------------------------------------------------------------------------

# Minimum identity of a read to its cluster's consensus (matching bases /
# alignment length).
#   Allowed:    number between 0 and 1.
#   Default:    0.85
#   Suggestion: 0.85 for R9.4.1 reads; 0.90-0.95 for R10.4.1 reads (they
#               typically score 0.95-0.99).
#   Effect:     higher assigns fewer reads ("below_threshold"), so read counts are
#               lower but cleaner; lower also counts noisy and chimeric reads.
min_identity = 0.85

# Minimum share of a read covered by its alignment to the consensus.
#   Allowed:    number between 0 and 1.
#   Default:    0.8
#   Effect:     lower also counts reads with extra sequence (concatemers,
#               chimeras, adapter remnants); higher excludes them.
min_coverage = 0.8

# minimap2 preset for the read assignment.
#   Allowed:    map-ont (nanopore reads), lr:hq (accurate R10.4.1 reads,
#               minimap2 >= 2.27), map-pb, asm20, sr.
#   Default:    map-ont
#   Suggestion: map-ont.
preset = map-ont


# -----------------------------------------------------------------------------
[primers]
# Used by: section 5. Sequences are turned to forward orientation and the
# primers are cut off, so that only the region between the primers is
# compared with the references.
# -----------------------------------------------------------------------------

# Forward and reverse primer, 5'->3' as ordered. Do NOT reverse-complement the
# reverse primer. IUPAC codes (R, Y, K, M, S, W, B, D, H, V, N) are allowed.
#   Default:  empty (no primer trimming and no orientation).
#   Effect:   a wrong or reverse-complemented primer is not found: sequences then
#             keep their primers and stay in mixed orientation.
forward = GACCCTATGGAGCTTTAGAC
reverse = CCRKGGTCRCCCCAAC

# Mismatches allowed per primer; an inserted or missing base also counts as one.
#   Allowed:    whole number >= 0.
#   Default:    4
#   Suggestion: 2-4 for 16-20 nt primers. Use 3 with require_both = yes.
#   Effect:     too low misses primers with real mismatches at the primer site (in
#               these data the forward primer site often reads GACCCTGTGG instead
#               of GACCCTATGG) or with sequencing errors: those sequences keep the
#               primer. Too high finds "primers" that aren't there: at 4, about 28
#               off-target OTUs get a forward primer match through indels, and
#               their first ~20 bases are cut off.
max_mismatches = 4

# Remove sequences in which the forward or the reverse primer isn't found.
#   Allowed:    yes / no
#   Default:    no
#   Suggestion: yes for a clean data set of complete amplicons (use with
#               max_mismatches = 3); no to see everything that was amplified.
#   Effect:     yes removes off-target products and truncated sequences, but also
#               real sequences whose primer site differs too much. no keeps them;
#               they are trimmed on the side where a primer was found.
require_both = no

# A primer must start within this many bases of the sequence end.
#   Allowed:    whole number >= 0.
#   Default:    50
#   Suggestion: long enough to cover tags, adapter remnants and primer
#               concatemers in front of the primer (here a 7 bp tag, plus up to
#               ~40 bp in concatemers): 50.
#   Effect:     too short misses primers behind longer leftovers; much longer
#               lets the search reach into short inserts (here ~70 bp), with a
#               small risk of a false match.
search_window = 50

# Sequences with fewer bases than this between the primers are primer dimers
# and are removed.
#   Allowed:    whole number >= 0.
#   Default:    30
#   Suggestion: well below the shortest real insert (here ~69-74 bp for fish).
#   Effect:     too high removes real short inserts.
min_insert = 30

# Cut the primers off.
#   Allowed:    yes / no
#   Default:    yes if primers are given
#   Effect:     no keeps the primers: sequences aren't oriented, primer bases count
#               as differences in the haplotype networks, and the same sequence in
#               both orientations is not merged.
trim = yes


# -----------------------------------------------------------------------------
[vsearch]
# Used by: section 5 (clustering of the ASVs into OTUs).
# -----------------------------------------------------------------------------

# Identity at which ASVs (unique sequences) are clustered into OTUs.
#   Allowed:    number between 0.5 and 1.0.
#   Default:    1.0
#   Suggestion: 1.0 to keep every haplotype separate (each OTU is one ASV);
#               0.97-0.99 for a species list with fewer OTUs.
#   Effect:     1.0: each sequence variant gets its own OTU, taxonomy and network,
#               but sequencing and consensus errors also become separate (rare)
#               OTUs. Lower values group variants: on a ~70 bp insert 0.97 allows
#               2 differences, enough to merge closely related species.
#               Exception at 1.0: an ASV identical to part of a longer ASV joins
#               that one's OTU (see n_asvs in otu_table.csv).
otu_identity = 1.0

# vsearch threads.
#   Allowed:    whole number >= 1.
#   Default:    8
#   Suggestion: the number of CPU cores. Results don't depend on it.
threads = 8


# -----------------------------------------------------------------------------
[haplonet]
# Used by: section 5 (BLAST taxonomy) and section 6 (haplotype networks).
# -----------------------------------------------------------------------------

# --- reference database (section 5) ---

# Reference FASTA. Empty: [paths] path_to_blastdb is used.
#   Allowed:  a FASTA file, or empty.
db = MIDORI2_lrRNA_blast.fasta

# Prefix of a BLAST database you built yourself from the same FASTA (the
# file names without .nsq/.nin/...), built WITHOUT -parse_seqids.
#   Allowed:    a database prefix, or empty.
#   Default:    empty: the database is built once in results/taxonomy/blastdb
#               (takes a few minutes) and reused afterwards.
#   Effect:     a database built from another FASTA than db stops section 5 with
#               an error, because the hit IDs aren't found in the FASTA.
blastdb = MIDORI2_lrRNA

# --- BLAST search (section 5) ---

# BLAST algorithm.
#   Allowed:    megablast, dc-megablast, blastn
#   Default:    megablast
#   Suggestion: megablast. Try dc-megablast if many OTUs get "no hits".
#   Effect:     megablast is fast and finds close matches (above ~90 %
#               identity); dc-megablast and blastn find more distant references
#               (slower; blastn slowest). They don't improve the species call when
#               the species is missing from the database.
blast_task = megablast

# Threads for BLAST, and parallel MAFFT jobs in section 6.
#   Allowed:    whole number >= 1.
#   Default:    8
#   Suggestion: the number of CPU cores. Results don't depend on it.
threads = 8

# Hits kept per OTU.
#   Allowed:    whole number >= 1.
#   Default:    100
#   Effect:     the taxonomy only uses the hits at the best identity, so this
#               mainly sets the size of the haplotype networks: more hits give
#               bigger networks, a slower section 6 and a larger HTML page.
top = 100

# BLAST is asked for top x oversample hits, because some are discarded (low
# query cover, N-runs).
#   Allowed:    whole number >= 1.
#   Default:    5
#   Effect:     higher is slower; only needed if many hits are discarded.
oversample = 5

# Minimum identity of a hit.
#   Allowed:    number between 0 and 1.
#   Default:    0.70
#   Effect:     lower adds more distant references to the networks. OTUs with no
#               hit above it are "no hits".
min_id = 0.70

# Minimum query cover of a hit, in % of the OTU.
#   Allowed:    0-100.
#   Default:    80
#   Effect:     lower accepts hits that cover only part of the OTU (risk of a
#               wrong taxonomy for chimeras); higher drops references that are
#               shorter than the insert.
min_qcov = 80

# Maximum E-value of a hit.
#   Allowed:    a positive number, e.g. 1e-5.
#   Default:    1e-5
#   Effect:     higher (e.g. 1e-3) accepts weaker hits; lower is stricter. For
#               short inserts very low values can remove real hits.
evalue = 1e-5

# Discard hits on reference regions with more than this share of N or other
# ambiguous bases.
#   Allowed:    number between 0 and 1.
#   Default:    0.02
#   Effect:     higher keeps references with N-runs, which show up as false
#               differences in the networks.
max_ambig = 0.02

# Trim an OTU to the part covered by its best hit, if at least trim_min bases
# at an end are not matched (chimeras and leftover artefacts).
#   Allowed:    yes / no
#   Default:    yes
#   Effect:     no keeps the unmatched part, which then counts as differences in
#               the network.
trim_query = yes

# Minimum number of unmatched bases at an end before an OTU is trimmed.
#   Allowed:    whole number >= 1.
#   Default:    10
trim_min = 10

# --- taxonomy (section 5) ---

# Hits within this many %-points of the best identity are pooled for the
# consensus.
#   Allowed:    number >= 0, in %-points.
#   Default:    0.0 (only the hits at exactly the best identity)
#   Suggestion: 0.0-1.0. On a ~70 bp insert one difference is ~1.4 %-points.
#   Effect:     higher pools more hits, giving more conservative assignments
#               (more often genus or family instead of species).
tie_delta = 0.0

# Share of the pooled best hits that must agree on a taxon at each rank.
#   Allowed:    number between 0.5 and 1.0.
#   Default:    0.6
#   Suggestion: 0.6-0.8; 1.0 = strict lowest common ancestor.
#   Effect:     higher is more conservative (fewer species-level calls); lower
#               gives more species calls but can follow misidentified references.
lca_cutoff = 0.6

# Clear ranks that the best identity doesn't support, using the cutoffs below.
#   Allowed:    yes / no
#   Default:    yes
#   Effect:     no keeps the full consensus (column consensus in otu_table.csv
#               always has it), so a 93 % hit can still be named to species.
rank_cutoffs = yes

# Minimum best-hit identity to keep each rank.
#   Allowed:    numbers between 0 and 1, decreasing from species to order.
#   Default:    0.98 / 0.95 / 0.90 / 0.85
#   Suggestion: common conventions, not universal values. On a ~70 bp insert 0.98
#               allows 1 difference for a species call, 0.97 would allow 2.
#   Effect:     higher cutoffs give fewer but more reliable species and genus
#               names; lower cutoffs name more OTUs, with more risk of naming the
#               closest species in the database instead of the real one.
species_identity = 0.98
genus_identity = 0.95
family_identity = 0.90
order_identity = 0.85

# --- haplotype networks and HTML page (section 6) ---

# Leave OTUs with fewer reads out of the haplotype-network page.
#   Allowed:    whole number >= 0.
#   Default:    0 (all OTUs)
#   Suggestion: 10-100 with otu_identity = 1.0, which gives many rare OTUs.
#   Effect:     higher gives a smaller, faster page; rare OTUs are left out of it
#               (they stay in the tables).
network_min_reads = 0

# MAFFT alignment strategy.
#   Allowed:    auto, localpair, globalpair, genafpair
#   Default:    auto
#   Suggestion: auto. localpair or globalpair are more accurate for up to ~200
#               sequences, but slower.
mafft_mode = auto

# How alignment gaps count in the network distances.
#   Allowed:    fifth (a gap is a difference), missing (gaps are ignored),
#               remove (gap columns are deleted)
#   Default:    fifth
#   Effect:     fifth counts real indels, but also nanopore homopolymer errors;
#               missing and remove ignore both.
gaps = fifth

# Taxa named in a node label before "+N more".
#   Allowed:    whole number >= 1.
#   Default:    2
max_label_taxa = 2

# Top hits whose BLAST alignment can be shown below the network.
#   Allowed:    whole number >= 0.
#   Default:    10
#   Effect:     higher makes the HTML file larger.
max_alignments = 10

# Look up WoRMS and GBIF IDs online for the best-hit links.
#   Allowed:    yes / no
#   Default:    yes
#   Effect:     yes needs internet while section 6 runs (results are kept in
#               taxon_links.json). no, or offline: the links search for the name,
#               and there is no OBIS link.
taxon_links = yes

# Title of the HTML page.
#   Allowed:  any text.
#   Default:  GRIFO haplotype networks
title = GRIFO haplotype networks


# -----------------------------------------------------------------------------
[BLAST]
# Used only by the old grifo.py script. The notebook ignores this section.
# -----------------------------------------------------------------------------
numthreads = 8
mts = 10
pct_ident = 98
db = SILVA_138
