# Conda environment for GRIFO v0.8
# Create:   mamba env create -f environment.yml
# Activate: mamba activate grifo
name: grifo
channels:
  - conda-forge
  - bioconda
dependencies:
  # Python and libraries
  - python=3.11
  - numpy
  - pandas
  - scikit-learn
  - jupyterlab
  # Command-line tools (must be on PATH)
  - nanofilt
  - nanostat
  - multiqc
  - minimap2
  - spoa
  - vsearch
  - blast
  - mafft
  - krona
